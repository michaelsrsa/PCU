<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARMESAN CINEMATIC UNIVERSE</title>
    <style>
        /* Base Styling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }

        /* Custom Background Image */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('maxresdefault.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            z-index: 1;
        }

        /* Retro "Press Start" Boot Screen */
        #boot-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99;
            cursor: pointer;
            transition: opacity 0.8s ease-out;
        }

        .heart-pointer {
            color: #ff0000;
            font-size: 32px;
            margin-bottom: 20px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        /* Main Game Menu UI */
        .menu-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .menu-container {
            border: 4px solid #fff;
            padding: 25px;
            background: rgba(0, 0, 0, 0.85);
            width: 90%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
        }

        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 2px 2px #ff0000;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-item {
            padding: 10px;
            margin: 8px 0;
            border: 2px solid #555;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            display: block;
            text-decoration: none;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
        }

        .menu-item:hover {
            border-color: #ffe600;
            background-color: #111;
            transform: scale(1.02);
            text-shadow: 0 0 5px #ffe600;
        }

        .menu-item.sub-btn {
            border-color: #00ffff;
            color: #00ffff;
        }

        .menu-item.sub-btn:hover {
            border-color: #ffffff;
            background-color: #003333;
            color: #fff;
        }

        .footer {
            margin-top: 15px;
            font-size: 10px;
            color: #888;
            letter-spacing: 1px;
        }

        /* Embedded Video Player Modal */
        #video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .video-box {
            position: relative;
            width: 85%;
            max-width: 850px;
            background: #000;
            border: 3px solid #ffe600;
            box-shadow: 0 0 30px rgba(255, 230, 0, 0.4);
            padding: 10px;
        }

        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            background: #ff0000;
            color: #fff;
            border: 2px solid #fff;
            padding: 5px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:hover {
            background: #cc0000;
        }

        iframe {
            width: 100%;
            height: 480px;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Audio Player -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- 1. Boot Screen -->
    <div id="boot-screen" onclick="startEngine()">
        <div class="heart-pointer">♥</div>
        <div style="font-size: 18px; letter-spacing: 4px; font-weight: bold;">PRESS ANYWHERE TO BOOT</div>
    </div>

    <!-- 2. Custom Background -->
    <div class="background-overlay"></div>

    <!-- 3. Interactive Menu Interface -->
    <div class="menu-wrapper">
        <div class="menu-container">
            <h1 id="menu-title">PARMESAN CINEMATIC UNIVERSE</h1>
            
            <!-- MAIN EPISODES MENU -->
            <div id="main-menu" class="menu-list">
                <a href="#" class="menu-item" onclick="playVideo('1rtz44ZLVs_lbw6hiOE2op1tvFiuLFpRK')">EPISODE 1: THE ORIGIN</a>
                <a href="#" class="menu-item" onclick="playVideo('11hrY5T2AXGCQPkAv6J4SPC9jVR5jTo34')">EPISODE 2: SECOND GRATE</a>
                <a href="#" class="menu-item" onclick="playVideo('1u0jas5QXq6ZhBBcYdA9FgHjTCL6QAq3g')">EPISODE 3: VQANGUARD</a>
                <a href="#" class="menu-item" onclick="playVideo('1OizAwf4YPQmQuGlHWdNfk_-zp1p-I0iP')">EPISODE 4: DEEMOZINE</a>
                <a href="#" class="menu-item sub-btn" onclick="toggleSubMenu('trailers-menu')">🎬 TRAILERS & EXTRAS</a>
            </div>

            <!-- TRAILERS & EXTRAS SUB-MENU -->
            <div id="trailers-menu" class="menu-list" style="display: none;">
                <a href="#" class="menu-item" onclick="playVideo('1rotCBW3nxoJowJQhQRHllyZgAGjIT25i')">PARM 2 TRAILER</a>
                <a href="#" class="menu-item" onclick="playVideo('10pBG5bT8DbUWOQX_ER-iIVbitMPsiE0P')">PARM 3 TRAILER</a>
                <a href="#" class="menu-item sub-btn" onclick="toggleSubMenu('main-menu')">⬅ BACK TO MAIN MENU</a>
            </div>

            <div class="footer">32-MONTHS AGED // AUTISM EXPANSION ACTIVE</div>
        </div>
    </div>

    <!-- 4. Retro Embedded Video Modal -->
    <div id="video-modal">
        <div class="video-box">
            <button class="close-btn" onclick="closeVideo()">CLOSE [X]</button>
            <iframe id="video-frame" src="" allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');

        function startEngine() {
            const bootScreen = document.getElementById('boot-screen');
            music.play().catch(e => console.log("Audio play deferred:", e));
            
            bootScreen.style.opacity = '0';
            setTimeout(() => {
                bootScreen.style.display = 'none';
            }, 800);
        }

        // Sub-menu switcher (Main Menu <-> Trailers)
        function toggleSubMenu(menuId) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('trailers-menu').style.display = 'none';
            document.getElementById(menuId).style.display = 'block';

            const title = document.getElementById('menu-title');
            if(menuId === 'trailers-menu') {
                title.innerText = "TRAILERS & EXTRAS";
            } else {
                title.innerText = "PARMESAN CINEMATIC UNIVERSE";
            }
        }

        // Opens the video modal iframe with background visible
        function playVideo(driveFileId) {
            const frame = document.getElementById('video-frame');
            const modal = document.getElementById('video-modal');
            
            frame.src = `https://drive.google.com/file/d/${driveFileId}/preview`;
            modal.style.display = 'flex';
            
            // Lower background soundtrack while video plays
            music.volume = 0.2;
        }

        function closeVideo() {
            const frame = document.getElementById('video-frame');
            const modal = document.getElementById('video-modal');
            
            frame.src = '';
            modal.style.display = 'none';
            music.volume = 1.0;
        }
    </script>
</body>
</html>
